<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login Admin</title>

    <link rel="stylesheet"
          href="admin-login.css">

</head>

<body>

    <div class="login-container">

        <h1>Login Admin</h1>

        <form id="form-login">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="pesan-login"></p>

    </div>


    <script src="admin-login.js"></script>

</body>

</html>
